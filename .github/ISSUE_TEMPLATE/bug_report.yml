name: 问题反馈
description: 报告 H’s 科研助手中的错误、异常或不符合预期的行为
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传论文原文、API 密钥、私人路径或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 0.3.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 使用方式
      options:
        - Windows 安装版
        - Windows 便携版
        - 本地源码运行
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么？请用自己的话描述即可。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你原本期望的结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可公开的截图或日志
      description: 请先遮挡论文内容、密钥、用户名和私人路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查并移除论文原文、API 密钥、私人路径等敏感信息。
          required: true
