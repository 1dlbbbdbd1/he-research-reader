name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime
        shell: pwsh
        run: |
          $electronExecutable = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $installExitCode = 0
          if (-not (Test-Path -LiteralPath $electronExecutable)) {
            node node_modules/electron/install.js
            $installExitCode = $LASTEXITCODE
          }
          if ($installExitCode -ne 0 -or -not (Test-Path -LiteralPath $electronExecutable)) {
            throw 'Electron runtime installation did not produce electron.exe.'
          }

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        run: npm run dist:win

      - name: Create checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -match '^XiaoHeResearchReader-(Setup|Portable)-.+-x64\.exe$' }
          if ($artifacts.Count -ne 2) {
            throw "Expected one setup installer and one portable executable, found $($artifacts.Count)."
          }
          $checksums = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
            "$($hash.Hash)  $($artifact.Name)"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
            Where-Object {
              $_.Name -match '^XiaoHeResearchReader-(Setup|Portable)-.+-x64\.exe$' -or
              $_.Name -eq 'SHA256SUMS.txt'
            } |
            ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "小何的科研阅读助手 $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
