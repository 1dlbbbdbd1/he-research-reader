name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime
        shell: pwsh
        run: |
          $electronExecutable = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $installExitCode = 0
          if (-not (Test-Path -LiteralPath $electronExecutable)) {
            node node_modules/electron/install.js
            $installExitCode = $LASTEXITCODE
          }
          if ($installExitCode -ne 0 -or -not (Test-Path -LiteralPath $electronExecutable)) {
            throw 'Electron runtime installation did not produce electron.exe.'
          }

      - name: Run tests
        run: npm test

      - name: Prepare bundled local translation
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $PWD '.runtime\translation'
          & ./scripts/setup-argos.ps1 -RuntimeRoot $runtimeRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Local translation runtime setup failed with exit code $LASTEXITCODE."
          }

          $requiredFiles = @(
            (Join-Path $runtimeRoot 'argos\.venv\Scripts\python.exe')
            (Join-Path $runtimeRoot 'packages')
            (Join-Path $runtimeRoot 'python')
          )
          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missingFiles) {
            throw "Bundled local translation runtime is incomplete: $($missingFiles -join ', ')"
          }

      - name: Verify bundled local translation
        run: npm run smoke:translation

      - name: Build Windows installers
        shell: pwsh
        run: |
          # NSIS cannot open some deeply nested Torch license paths under the
          # long GitHub Actions checkout prefix. Build from a short mapped
          # drive so the complete licensed runtime stays in the installer.
          $buildDrive = 'R:'
          & subst.exe $buildDrive $PWD
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to map the short build drive $buildDrive."
          }
          try {
            Push-Location "$buildDrive\"
            npm run dist:win
            if ($LASTEXITCODE -ne 0) {
              throw "Windows installer build failed with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
            & subst.exe $buildDrive /D
          }

      - name: Create checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -match '^HsResearchAssistant-(Setup|Portable)-.+-x64\.exe$' }
          if ($artifacts.Count -ne 2) {
            throw "Expected one setup installer and one portable executable, found $($artifacts.Count)."
          }
          $checksums = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
            "$($hash.Hash)  $($artifact.Name)"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
            Where-Object {
              $_.Name -match '^HsResearchAssistant-(Setup|Portable)-.+-x64\.exe$' -or
              $_.Name -eq 'SHA256SUMS.txt'
            } |
            ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "H’s 科研助手 $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
